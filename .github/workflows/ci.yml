name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, lint, build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edu_platform_test
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U postgres -d edu_platform_test"
          --health-interval=5s --health-timeout=5s --health-retries=12
      redis:
        image: redis:8-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=12
    # Disposable CI-only settings. No repository secrets or external services.
    env:
      CI: 'true'
      NODE_ENV: test
      APP_PORT: '3101'
      FRONTEND_ORIGIN: http://127.0.0.1:4174
      VITE_API_URL: http://127.0.0.1:3101
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: edu_platform_test
      POSTGRES_SCHEMA: public
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      ACCESS_JWT_SECRET: ci-only-access-secret-at-least-32-characters
      INVITATION_TOKEN_SECRET: ci-only-invite-secret-at-least-32-characters
      PASSWORD_RESET_TOKEN_SECRET: ci-only-reset-secret-at-least-32-characters
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '2525'
      SMTP_SECURE: 'false'
      SMTP_USER: ci
      SMTP_PASSWORD: ci
      SMTP_FROM: ci@example.test
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.15.0
          cache: true
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint and repository hygiene
        run: pnpm lint
      - name: Type checks (including API type tests and browser tests)
        run: pnpm typecheck
      - name: Production builds
        run: pnpm build
      - name: API integration tests with PostgreSQL and Redis
        run: pnpm --filter api test:integration
      - name: Admin unit tests
        run: pnpm test:admin
      - name: Install Chromium
        run: pnpm --filter admin exec playwright install --with-deps chromium
      - name: Admin browser regression tests
        run: pnpm --filter admin test:e2e
      - name: Admin end-to-end tests with real API
        run: pnpm --filter admin test:e2e:real
      - name: Final repository hygiene check
        if: always()
        run: pnpm artifacts:check
      - name: Upload browser reports and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-reports
          path: |
            apps/admin/playwright-report/
            apps/admin/test-results/
          if-no-files-found: ignore
          retention-days: 7
